name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the tests
        run: python tests/run_all.py
  linux-portability:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["python:3.12-slim", "python:3.12-alpine"]
    steps:
      - uses: actions/checkout@v4
      - name: Run Python tests on Debian and Alpine
        run: >-
          docker run --rm
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly"
          -w /src
          -e PYTHONDONTWRITEBYTECODE=1
          -e SHELFRIP_DATA=/tmp/shelfrip-tests
          ${{ matrix.image }} python tests/run_all.py
