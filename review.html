<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelfrip</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1b1f24; --muted:#5f6b78; --line:#dde2e8;
  --accent:#2f6fdb; --accent-ink:#fff; --warn-bg:#fff6e0; --warn:#8a5a00;
  --skip:#9aa4ae; --ok:#1d7a46; --err:#b42318; --chip:#eef1f5; --input:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121417; --card:#1b1f24; --ink:#e7eaee; --muted:#9aa4ae; --line:#2c323a;
    --accent:#5b8ff0; --accent-ink:#0b0d10; --warn-bg:#3a2e12; --warn:#f2c46b;
    --skip:#6b7580; --ok:#5fcf8f; --err:#ff8a7a; --chip:#252b33; --input:#14181c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0 12px 0 0}
header .sub{color:var(--muted)}
main{max-width:1280px;margin:0 auto;padding:16px 20px 80px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:6px;padding:5px 10px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line);
  border-radius:5px;padding:4px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 18px;overflow:hidden}
.card-head{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{font-size:16px;font-weight:650}
.chip{background:var(--chip);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:13px}
.err{color:var(--err)} .ok{color:var(--ok)}
label.f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
label.f input{min-width:0}
.libdir{flex:1 1 420px} .libdir input{width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--chip)}
tr.skip td{color:var(--skip)} tr.skip input,tr.skip select.cat{opacity:.45}
td.dur{font-variant-numeric:tabular-nums;white-space:nowrap}
td.src{font-size:12px;color:var(--muted);max-width:180px;overflow-wrap:anywhere}
td.name input{width:100%}
.dest{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
.note{font-size:12px;color:var(--warn)}
.foot{padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;flex:1 1 200px}
.bar>i{display:block;height:100%;background:var(--accent)}
.search{display:none;gap:6px;flex-direction:column;padding:8px;background:var(--chip);border-radius:8px}
.search.open{display:flex}
.result{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}
.result small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.tablewrap{overflow-x:auto}
nav.tabs{display:none;gap:4px} nav.tabs.on{display:flex}
nav.tabs button{border-radius:20px} nav.tabs button.cur{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--chip);color:var(--ink);font-size:12px;margin-left:4px}
nav.tabs button.cur .count{background:rgba(255,255,255,.25);color:inherit}
.stats{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;margin-bottom:14px}
.auto{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--line)}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.drive{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
.drive .dev{font-weight:650;font-size:16px}
.drive .lab{font-size:15px;overflow-wrap:anywhere}
.drive .st{color:var(--muted);font-size:13px}
.drive .bar{flex:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.switch{display:flex;gap:8px;align-items:center;font-weight:600}
pre.log{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;
  max-height:320px;overflow:auto;white-space:pre-wrap;margin:0;color:var(--muted)}
.set{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;max-width:760px}
.set label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.set label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.set input[type=text],.set input[type=password],.set input[type=number],.set select{width:100%}
.wiz{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;max-width:760px;margin-bottom:16px}
.wiz h2{margin:0 0 4px;font-size:18px}
.wiz ol{margin:12px 0;padding-left:22px;display:grid;gap:14px}
.wiz li label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.wiz li input[type=text],.wiz li input[type=password],.wiz li select{width:100%}
.wiz li label.chk{display:flex;gap:8px;align-items:center;margin-top:6px}
.wiz .how{font-size:12px;color:var(--muted)}
.hide{display:none!important}
.aud{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.aud .trk{border:1px solid var(--line);border-radius:12px;padding:1px 8px;cursor:pointer;background:var(--card);color:var(--muted);font-size:12px}
.aud .trk.com{border-color:var(--accent);color:var(--ink)}
.aud input{font-size:12px;padding:2px 5px;min-width:220px}
tr.splitrow td{background:var(--chip);border-bottom:1px solid var(--line)}
.split{display:grid;gap:6px;padding:4px 0}
.split table td{border-bottom:none;padding:3px 6px}
.split .sl{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:12px}
.split .snm{width:100%}
@media (max-width:700px){ td.src{display:none} th.src{display:none} }
#upd{font-size:13px;margin-right:10px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Shelfrip</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="drives">Drives</button>
    <button data-tab="review">Review<span class="count" id="nwait">0</span></button>
    <button data-tab="library">Library</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <span class="sub" id="sub"></span>
  <span style="flex:1"></span>
  <button id="scan" class="tab-review">Check for new rips</button>
  <a id="upd" class="hide" target="_blank" rel="noopener"></a>
  <button id="quit" class="hide">Quit</button>
</header>
<main id="drivesTab" class="hide"></main>
<main id="list"><p class="empty">Loading…</p></main>
<main id="libraryTab" class="hide"></main>
<main id="settingsTab" class="hide"></main>

<script>
const CATS = ["Featurettes","Behind the Scenes","Deleted Scenes","Interviews","Scenes","Shorts","Trailers","Other"];
let discs = [], LIB = "", LIB_RIPPED = "", SERVER = "plex", SERVER_NAME = "Plex";
// name parts the same way naming.py does for the chosen media server
const idTag = id => !id ? "" : SERVER === "plex" ? ` {tmdb-${id}}` : SERVER === "jellyfin" ? ` [tmdbid-${id}]` : SERVER === "emby" ? ` [tmdbid=${id}]` : "";
const editionName = (base, ed) => SERVER === "plex" ? `${base} {edition-${ed}}` : `${base} - ${ed}`;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe = s => String(s||"").replace(/\s*:\s*/g," - ").replace(/[<>"/\\|?*]/g,"").replace(/\s+/g," ").trim().replace(/[ .]+$/,"");

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

const KIND = {"Featurettes":"Featurette","Behind the Scenes":"Behind the scenes","Deleted Scenes":"Deleted scene","Interviews":"Interview","Scenes":"Scene","Shorts":"Short","Trailers":"Trailer","Other":"Other"};
const SUFFIX = {"Behind the Scenes":"behindthescenes","Deleted Scenes":"deleted","Featurettes":"featurette","Interviews":"interview","Scenes":"scene","Shorts":"short","Trailers":"trailer","Other":"other"};
function destOf(p, it){
  // TV extras can belong to the whole show, a season (default) or one episode (Plex's TV extras guide)
  const cat = it.category || "Other";
  const folder = SERVER === "kodi" ? "Extras" : cat;   // Kodi keeps all extras in one Extras folder
  if (it.role === "extra" && p.kind === "tv" && it.attach === "show") return [LIB, p.library_dir, folder].join("\\") + "\\" + safe(it.name) + ".mkv";
  if (it.role === "extra" && p.kind === "tv" && it.attach === "episode" && SERVER !== "kodi"){
    if (!it.attach_to) return "pick the episode it belongs to";
    const same = p.items.filter(o => o.role === "extra" && o.action === "move" && o.attach === "episode" && o.attach_to === it.attach_to && (o.category || "Other") === cat);
    const k = same.findIndex(o => o === it || o.source === it.source);
    return [LIB, it.dest_dir].join("\\") + "\\" + safe(`${it.attach_to}-${SUFFIX[cat] || "other"}${same.length > 1 ? k + 1 : ""}`) + ".mkv";
  }
  const parts = [LIB, it.dest_dir];
  if (it.role === "extra") parts.push(folder);
  return parts.join("\\") + "\\" + safe(it.name) + ".mkv";
}
function episodeStems(p){  // episodes on this disc, then ones already in the library's season folder
  const out = [];
  for (const it of p.items){
    if (it.role !== "episode" || it.action !== "move") continue;
    if (it.needs_split && it.split) it.split.names.forEach((n, k) => { if (!(it.split.skip||[]).includes(k)) out.push(safe(n)); });
    else out.push(safe(it.name));
  }
  for (const f of p.season_files || []) out.push(f);
  return [...new Set(out)];
}
function attachLine(p, it, j){
  if (p.kind !== "tv" || it.role !== "extra" || it.action === "skip") return "";
  const a = it.attach || "season";
  const eps = episodeStems(p);
  return `<div class="row" style="gap:6px;font-size:12px;margin-top:4px">Belongs to
    <select class="att" data-j="${j}"><option value="season" ${a==="season"?"selected":""}>Season ${esc(p.season)}</option>
      <option value="show" ${a==="show"?"selected":""}>Whole show</option><option value="episode" ${a==="episode"?"selected":""}>An episode…</option></select>
    ${a === "episode" ? `<select class="atte" data-j="${j}" style="max-width:340px"><option value="">pick the episode</option>${eps.map(e =>
      `<option value="${esc(e)}" ${e===it.attach_to?"selected":""}>${esc((e.match(/s\d+e\d+.*$/i)||[e])[0])}</option>`).join("")}</select>
      as <select class="attk" data-j="${j}">${CATS.map(c => `<option value="${c}" ${c===(it.category||"Other")?"selected":""}>${KIND[c]}</option>`).join("")}</select>` : ""}</div>`;
}

// Keep each item's folder in step with the show/movie folder at the top of the card
function reflow(p){
  for (const it of p.items){
    it.dest_dir = p.kind !== "tv" ? p.library_dir
      : (it.role === "episode" && it.season === 0) ? `${p.library_dir}\\Specials` : `${p.library_dir}\\Season ${p.season}`;
  }
}

// The "Type" menu: what each ripped title is. Extras pick their Plex category here too.
function typeValue(it){
  if (it.role === "extra") return "x:" + (it.category || "Other");
  if (it.role === "episode") return it.season === 0 ? "special" : "episode";
  return it.role;   // main, edition, play_all
}
function typeOptions(p, it){
  const opts = p.kind === "tv"
    ? [["episode","Episode"],["special","Special (Season 0)"]]
    : [["main","Movie"],["edition","Other version"]];
  if (it.role === "play_all") opts.push(["play_all","Play All"]);
  const cur = typeValue(it);
  return opts.map(([v,l]) => `<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")
    + `<optgroup label="Extra">` + CATS.map(c => `<option value="x:${c}" ${("x:"+c)===cur?"selected":""}>${c}</option>`).join("") + `</optgroup>`;
}
const pad = n => String(n).padStart(2,"0");
const mmss = s => { s = +s||0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}h${pad(m)}m` : `${m}m${pad(x)}s`; };
function epTail(name){ return (String(name||"").split(/ - s\d+e\d+(?:-e\d+)?/i)[1] || "").replace(/^ - /,""); }
// --- videos holding several episodes: where each one starts (mirrors split.py)
const hms = s => { s = Math.max(0, +s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60); return (h ? h + ":" + pad(m) : m) + ":" + pad(x); };
function epRanges(sp, i){
  const ch = sp.chapters, n = ch.length, st = sp.starts;
  const op = sp.copy_opening ? (sp.opening||0) : 0, en = sp.copy_ending ? (sp.ending||0) : 0;
  const t = j => j < n ? ch[j] : sp.total;
  const a = (i === 0 && !op) ? 0 : st[i], b = i + 1 < st.length ? st[i+1] : n - en;
  const r = [];
  if (op && st[i] >= op) r.push([t(0), t(op)]);
  r.push([t(a), t(b)]);
  if (en) r.push([t(n - en), sp.total]);
  return r.filter(([x,y]) => y - x >= 0.05);
}
const epLen = (sp, i) => epRanges(sp, i).reduce((s, [a,b]) => s + b - a, 0);
function splitBad(sp){
  if (!sp || !sp.starts || !sp.starts.length) return "No split.";
  if (sp.starts.some((v, k) => k && v <= sp.starts[k-1])) return "Each episode must start after the one before it.";
  return "";
}
function splitRow(p, it, j){
  const sp = it.split, n = sp.chapters.length;
  const chOpt = (sel, from) => sp.chapters.map((c, k) => k < from ? "" :
      `<option value="${k}" ${k===sel?"selected":""}>chapter ${k+1} · ${hms(c)}</option>`).join("");
  const cntOpt = (sel, label) => [0,1,2,3].filter(k => k < n).map(k =>
      `<option value="${k}" ${k===sel?"selected":""}>${k ? `${label} ${k} chapter${k>1?"s":""}` : "none"}</option>`).join("");
  const opLen = sp.opening ? sp.chapters[Math.min(sp.opening, n-1)] - sp.chapters[0] : 0;
  const bad = splitBad(sp);
  const rows = sp.starts.map((st, k) => {
    const nm = sp.names[k] || "";
    const off = (sp.skip||[]).includes(k);
    return `<tr style="${off ? "opacity:.5" : ""}"><td class="sl"><label title="Cut this episode out and file it"><input type="checkbox" class="skp" data-j="${j}" data-k="${k}" ${off ? "" : "checked"}> Episode ${k+1}</label></td>
      <td><select class="sst" data-j="${j}" data-k="${k}">${chOpt(st, 0)}</select></td>
      <td class="sl">${mmss(Math.round(epLen(sp, k)))}</td>
      <td style="width:100%"><input class="snm" data-j="${j}" data-k="${k}" value="${esc(nm)}">
        <div class="dest">${it.action==="skip" || off ? "not filed" : esc(destOf(p, Object.assign({}, it, {name:nm})))}</div></td></tr>`;
  }).join("");
  return `<tr class="splitrow ${it.action === "skip" ? "skip" : ""}"><td></td><td colspan="5"><div class="split">
    <div class="row">
      <label class="f">Episodes in this video <input class="spn" data-j="${j}" type="number" min="2" max="${n}" value="${sp.starts.length}" style="width:56px"></label>
      <label class="f">Opening on every episode <select class="spo" data-j="${j}">${cntOpt(sp.copy_opening ? sp.opening : 0, "first")}</select></label>
      <label class="f">Ending on every episode <select class="spe" data-j="${j}">${cntOpt(sp.copy_ending ? sp.ending : 0, "last")}</select></label>
      <span class="chip">${esc(sp.confidence || "")} confidence</span>
    </div>
    <table>${rows}</table>
    ${bad ? `<div class="note">${esc(bad)}</div>` : ""}
    <div class="note" style="color:var(--muted)">Use ▶ to watch the video and check where episodes begin. Nothing is re-encoded; cuts land on chapter marks.</div>
  </div></td></tr>`;
}
// audio tracks: all are kept; click one to mark it as a commentary and give it a name
function audioLine(it, j){
  if (!it.audio || !it.audio.length || it.action === "skip") return "";
  return `<div class="aud">Audio:` + it.audio.map((a, k) =>
    `<button class="trk ${a.commentary ? "com" : ""}" data-j="${j}" data-k="${k}" title="Click to mark or unmark as a commentary">${esc(a.desc)}${a.commentary ? " · commentary" + (a.guessed ? "?" : "") : ""}</button>` +
    (a.commentary ? `<input class="trkname" data-j="${j}" data-k="${k}" value="${esc(a.name)}" placeholder="Commentary name">` : "")).join("") + `</div>`;
}
const filesOf = it => it.action !== "move" ? 0 : (it.needs_split && it.split ? it.split.starts.length - (it.split.skip||[]).length : 1);

function setType(p, it, v){
  const prefix = safe(p.title + (p.year ? ` (${p.year})` : ""));
  const tag = idTag(p.tmdb_id);
  const was = it.role;
  it.needs_split = false; delete it.split;
  if (v.startsWith("x:")){
    const keepName = was === "extra" || was === "play_all" ? it.name : "";
    it.role = "extra"; it.category = v.slice(2);
    it.name = keepName || epTail(it.name) || `Extra (${mmss(it.duration_seconds)})`;
    delete it.episode; delete it.episodes;
  } else if (v === "episode" || v === "special"){
    const season = v === "special" ? 0 : p.season;
    const used = p.items.filter(o => o !== it && o.role === "episode" && (o.season||0) === season)
                        .flatMap(o => o.episodes || [o.episode]);
    const n = Math.max(0, ...used) + 1;
    const tail = was === "extra" ? it.name : epTail(it.name);
    Object.assign(it, {role:"episode", season, episode:n, episodes:[n]});
    delete it.category;
    it.name = `${prefix} - s${pad(season)}e${pad(n)}` + (tail ? ` - ${safe(tail)}` : "");
  } else if (v === "main"){
    p.items.forEach(o => { if (o !== it && o.role === "main"){ o.role = "edition"; o.name = editionName(`${prefix}${tag}`, "Alternate"); } });
    it.role = "main"; delete it.category; it.name = `${prefix}${tag}`;
  } else if (v === "edition"){
    it.role = "edition"; delete it.category; it.name = editionName(`${prefix}${tag}`, "Alternate");
  } else {
    it.role = v; delete it.category;
  }
  if (it.note && /episode|Play All|long video|several episodes/i.test(it.note)) it.note = "";
  reflow(p);
}

function plexLine(px){
  if (!px) return "";
  const bad = (px.files||[]).filter(f => f.state !== "ok");
  const cls = px.state === "error" || bad.some(f => f.state === "wrong") ? "err" : px.state === "done" && !bad.length ? "ok" : "";
  return `<div style="flex-basis:100%" class="${cls}">${esc(px.summary || "")}${bad.length ? "<br>" + bad.map(f => `${esc(f.file)}: ${esc(f.why)}`).join("<br>") : ""}</div>`;
}

function redraw(i){
  const cur = $("#c"+i);
  if (!cur) return render();
  cur.outerHTML = card(discs[i], i); wire(discs[i], i);
}
function render(){
  const list = $("#list");
  if (!discs.length){ list.innerHTML = `<p class="empty">Nothing waiting for review. Rip some discs, then click “Check for new rips”.</p>`; return; }
  list.innerHTML = discs.map((p, i) => card(p, i)).join("");
  discs.forEach((p, i) => wire(p, i));
}

function card(p, i){
  const job = p.job;
  if (job && job.state === "done") return `<section class="card" id="c${i}"><div class="foot">
    <span class="ok">✓ ${esc(p.title)}${p.year ? ` (${esc(p.year)})` : ""}: ${job.current === "Discarded" ? "rip discarded." : `filed into ${SERVER_NAME}.`}</span>
    <span style="color:var(--muted)">${job.note ? esc(job.note) : "Its rip folder was cleared to save space (skipped clips included)."}</span>
    ${plexLine(job.plex)}</div></section>`;
  if (p.kind === "music") return musicCard(p, i);
  const kind = p.kind === "tv" ? "TV" : "Movie";
  const rows = p.items.map((it, j) => {
    const cat = `<select class="typ" data-j="${j}">${typeOptions(p, it)}</select>`;
    return `<tr class="${it.action === "skip" ? "skip" : ""}">
      <td><button class="play" data-j="${j}" title="Play">▶</button></td>
      <td class="dur">${esc(it.duration)}</td>
      <td><select class="act" data-j="${j}"><option value="move" ${it.action==="move"?"selected":""}>Keep</option><option value="skip" ${it.action==="skip"?"selected":""}>Skip</option></select></td>
      <td>${cat}</td>
      <td class="name"><input class="nm" data-j="${j}" value="${esc(it.name)}" ${byEpisode(p, it) ? 'style="display:none"' : ""}>
        <div class="dest">${it.action==="skip" ? "not filed" : (it.needs_split && it.split) ? `cut into ${it.split.starts.length} episodes (below)` : esc(destOf(p, it))}</div>

// ------------------------------------------------------------------ music CDs
const fsName = t => String(t||"").replace(/\s*[\/\\]\s*/g, "-").replace(/\s*:\s*/g, " - ").replace(/[<>"|?*\x00-\x1f]/g, "").replace(/\s+/g, " ").replace(/^[ .]+|[ .]+$/g, "").slice(0, 120);
const albumDir = p => `${p.dest_root}\\${fsName(p.compilation ? "Various Artists" : p.album_artist)}\\${fsName(p.album)}`;
const trackFile = (p, it) => `${(+p.discs||1) > 1 ? (+p.disc||1) + pad(it.track) : pad(it.track)} - ${fsName(it.title)}.flac`;
// "N extra(s) still have placeholder names" is counted again from the names as they are now
const PH = /extra\(s\) still have placeholder names/;
// an extra tied to one episode is named after that episode, so its own name isn't used
const byEpisode = (p, it) => p.kind === "tv" && it.role === "extra" && it.attach === "episode";
const isPlaceholder = it => it.role === "extra" && it.action === "move" && it.attach !== "episode" && /^Extra \d+ \(/.test(it.name || "");
function phWarning(p){ const n = p.items.filter(isPlaceholder).length; return n ? `${n} extra(s) still have placeholder names.` : ""; }
function liveWarnings(p){
  const ws = (p.warnings||[]).filter(w => !PH.test(w));
  const ph = phWarning(p);
  return ph ? ws.concat([ph]) : ws;
}
function autoLine(p){
  const a = p.auto;
  if (!a || (p.job && p.job.state)) return "";
  if (!a.blocked.length){
    const t = new Date(a.at * 1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    return `<div class="auto">✓ Everything matched with confidence: files automatically ${a.at * 1000 <= Date.now() ? "in a moment" : "at " + t}. <button class="hold">I'll review it</button></div>`;
  }
  const own = a.blocked.filter(w => !(p.warnings||[]).includes(w));
  return own.length ? `<div class="sub" style="color:var(--muted);font-size:12px">Waiting for your review: ${esc(own.join("; "))}</div>` : "";
}

      ${(p.releases||[]).length > 1 ? `<div class="row"><label class="f" style="flex:1">Release${p.release_sure ? "" : ` <span class="err">(not sure which, please check)</span>`}
        <select class="release" style="max-width:100%">${p.releases.map(r => `<option value="${esc(r.id)}" ${r.id===p.release?"selected":""}>${esc(r.label)}</option>`).join("")}</select></label></div>` : ""}

function wireMusic(p, i, msg, rerender){

  el.querySelectorAll(".ttl").forEach(n => n.oninput = () => { p.items[n.dataset.j].title = n.value; refreshDest(); });
  el.querySelectorAll(".art").forEach(n => n.oninput = () => { p.items[n.dataset.j].artist = n.value; });

  $(".alb", el).oninput = e => { p.album = p.title = e.target.value; refreshDest(); };

  $(".comp", el).onchange = e => { p.compilation = e.target.checked; rerender(); };
  const rel = $(".release", el);
  if (rel) rel.onchange = async () => {
    msg.textContent = "Renaming from that release…";
    try { const r = await api("/api/release", {folder:p.folder, plan:p, release:rel.value}); Object.assign(p, r.plan); rerender(); }
    catch(e){ msg.textContent = e.message; }
  };
  $(".discard", el).onclick = async () => {

    if (j.error){ msg.textContent = j.error; return; }
    p.job = {state:"done", current:"Discarded", note:"Rip deleted"}; rerender();
  };
  $(".save", el).onclick = async () => { await api("/api/save", {folder:p.folder, plan:p}); msg.textContent = "Saved."; };
  $(".file", el).onclick = async () => {
    const keep = p.items.filter(it => it.action === "move").length;

    const j = await api("/api/file", {folder:p.folder, plan:p});
    if (j.problems){ const m2 = $(".msg", $("#c"+i)) || msg; m2.innerHTML = `<span class="err">${j.problems.map(esc).join("<br>")}</span>`; return; }
    poll();
  };
}

function wire(p, i){
  const el = $("#c"+i), msg = $(".msg", el);
  if (!msg) return; // filed
  const rerender = () => { const cur = $("#c"+i); if (cur){ cur.outerHTML = card(p, i); wire(p, i); } };
  const hold = () => { if (p.auto && !p.hold){ p.hold = true; p.auto.blocked = ["you chose to review it"]; api("/api/hold", {folder:p.folder}).catch(()=>{}); } };
  el.addEventListener("input", hold); el.addEventListener("change", hold);
  const hb = $(".hold", el); if (hb) hb.onclick = () => { hold(); rerender(); };
  if (p.kind === "music") return wireMusic(p, i, msg, rerender);
  el.querySelectorAll(".play").forEach(b => b.onclick = () => api("/api/play", {folder:p.folder, source:p.items[b.dataset.j].source}).catch(e => msg.textContent = e.message));
  el.querySelectorAll(".act").forEach(s => s.onchange = () => { p.items[s.dataset.j].action = s.value; rerender(); });
  el.querySelectorAll(".typ").forEach(s => s.onchange = () => { setType(p, p.items[s.dataset.j], s.value); rerender(); });
  el.querySelectorAll(".att").forEach(s => s.onchange = () => { const it = p.items[s.dataset.j]; it.attach = s.value; if (s.value !== "episode") delete it.attach_to; rerender(); });
  el.querySelectorAll(".atte").forEach(s => s.onchange = () => { p.items[s.dataset.j].attach_to = s.value; rerender(); });
  el.querySelectorAll(".attk").forEach(s => s.onchange = () => { p.items[s.dataset.j].category = s.value; rerender(); });
  el.querySelectorAll(".nm").forEach(n => n.oninput = () => {
    const it = p.items[n.dataset.j];
    if (it.role === "episode"){ const was = safe(it.name), now = safe(n.value);  // keep its extras attached
      p.items.forEach(o => { if (o.attach === "episode" && o.attach_to === was) o.attach_to = now; }); }
    it.name = n.value;
    const ph = phWarning(p), box = $(".phwarn", el);
    if (box && !ph) box.remove(); else if (box) box.textContent = ph;
    const d = n.parentElement.querySelector(".dest"); if (d && it.action !== "skip") d.textContent = destOf(p, it);
  });
  // Typed a different sNNeNN into a name? Look the episode up on TMDB and use its title.
  const lookupName = async (input, apply) => {
    const m = input.value.match(/ - s(\d+)e(\d+)(?!\d|-e)/i);
    if (!m) return;
    const season = +m[1], ep = +m[2];
    try {
      const r = await api("/api/epnames", {folder:p.folder, plan:{title:p.title, year:p.year, tmdb_id:p.tmdb_id}, season, episodes:[ep]});
      const full = r.names[ep];
      if (full && / - s\d+e\d+ - /i.test(full)) apply(full, season, ep);
      else msg.textContent = `TMDB has no s${pad(season)}e${pad(ep)} for this show.`;
    } catch(e){ msg.textContent = e.message; }
  };
  el.querySelectorAll(".nm").forEach(n => n.onchange = () => {
    const it = p.items[n.dataset.j];
    if (it.role !== "episode" || (it.episodes||[]).length > 1) return;
    lookupName(n, (full, season, ep) => {
      Object.assign(it, {name: full, season, episode: ep, episodes: [ep]}); delete it.library_copy;
      if (it.note && /TMDB|check the episode number/i.test(it.note)) it.note = "";
      reflow(p); rerender();
    });
  });
  el.querySelectorAll(".snm").forEach(n => n.onchange = () => {
    const it = p.items[n.dataset.j], k = +n.dataset.k;
    lookupName(n, (full, season, ep) => {
      it.split.names[k] = full;
      if (it.episodes && season === it.season) it.episodes[k] = ep;
      delete it.library_copy; rerender();
    });
  });
  el.querySelectorAll(".trk").forEach(b => b.onclick = () => {
    const a = p.items[b.dataset.j].audio[+b.dataset.k];

    if (a.commentary && !a.name) a.name = "Commentary";
    rerender();
  });
  el.querySelectorAll(".trkname").forEach(n => n.oninput = () => { p.items[n.dataset.j].audio[+n.dataset.k].name = n.value; });
  el.querySelectorAll(".skp").forEach(c => c.onchange = () => {
    const sp = p.items[c.dataset.j].split, k = +c.dataset.k;
    sp.skip = (sp.skip||[]).filter(x => x !== k).concat(c.checked ? [] : [k]).sort((a,b) => a-b); rerender();
  });
  el.querySelectorAll(".sst").forEach(s => s.onchange = () => { p.items[s.dataset.j].split.starts[+s.dataset.k] = +s.value; rerender(); });
  el.querySelectorAll(".snm").forEach(n => n.oninput = () => {
    const it = p.items[n.dataset.j]; it.split.names[+n.dataset.k] = n.value;
    const d = n.parentElement.querySelector(".dest"); if (d && it.action !== "skip") d.textContent = destOf(p, Object.assign({}, it, {name:n.value}));
  });
  el.querySelectorAll(".spo").forEach(s => s.onchange = () => {
    const sp = p.items[s.dataset.j].split, k = +s.value;
    sp.opening = k; sp.copy_opening = k > 0;
    if (k && sp.starts[0] < k) sp.starts[0] = k;   // the first episode's own part starts after the opening
    if (!k && sp.starts[0] > 0 && sp.starts[0] <= 3) sp.starts[0] = 0;
    rerender();
  });
  el.querySelectorAll(".spe").forEach(s => s.onchange = () => {

  const renum = $(".renum", el);
  if (renum) renum.onclick = async () => {

    catch(e){ msg.textContent = "Couldn't get TMDB titles: " + e.message; }
    const prefix = safe(p.title + (p.year ? ` (${p.year})` : ""));
    const nm = e => names[e] || `${prefix} - s${pad(p.season)}e${pad(e)}`;
    for (const it of eps){
      const e = it.episodes;
      it.name = e.length > 1 ? `${prefix} - s${pad(p.season)}e${pad(e[0])}-e${pad(e[e.length-1])}` : nm(e[0]);
      if (it.split) it.split.names = e.map(nm);

      res.innerHTML = j.results.map(r => `<div class="result"><button data-id="${r.id}">Use</button>
        <b>${esc(r.title)}</b> <small>${esc(r.year)} · tmdb-${r.id}</small> <small>${esc(r.overview)}</small></div>`).join("") || "No results.";
      res.querySelectorAll("button").forEach(b => b.onclick = async () => {
        res.textContent = "Re-naming…";
        const j2 = await api("/api/rematch", {folder:p.folder, kind, tmdb_id:b.dataset.id, season: kind==="tv" ? (p.season||1) : null});

  $(".discard", el).onclick = async () => {
    if (!confirm(`Delete the whole rip of ${p.disc_label} from ${LIB_RIPPED}? Nothing is copied into ${SERVER_NAME}.`)) return;
    const j = await api("/api/discard", {folder:p.folder});
    if (j.error){ msg.textContent = j.error; return; }

  };
  $(".save", el).onclick = async () => { await api("/api/save", {folder:p.folder, plan:p}); msg.textContent = "Saved."; };
  $(".file", el).onclick = async () => {
    const keep = p.items.reduce((s, it) => s + filesOf(it), 0);

function poll(){
  clearTimeout(polling);
  polling = setTimeout(async () => { await load(true); if (discs.some(d => d.job && (d.job.state === "running" || (d.job.plex && /starting|scanning/.test(d.job.plex.state))))) poll(); }, 1500);
}

async function load(keepEdits){
  const j = await api("/api/discs");
  LIB = j.library; LIB_RIPPED = j.ripped; SERVER = j.server || "plex"; SERVER_NAME = j.server_name || "Plex";
  $("#sub").textContent = `${j.discs.length} disc(s) waiting · library: ${LIB}` + (j.tmdb ? "" : " · no TMDB key");
  if (keepEdits){ // only refresh job status, keep unsaved edits
    // Redraw just the cards whose filing status changed, so typing or a dropdown open on
    // another card isn't interrupted while a disc is filing.
    const byFolder = Object.fromEntries(j.discs.map(d => [d.folder, d]));
    discs.forEach((d, i) => {
      const job = byFolder[d.folder] ? byFolder[d.folder].job : ((j.jobs||{})[d.folder] || {state:"done", current:"Filed"});
      if (JSON.stringify(job || null) === JSON.stringify(d.job || null)) return;
      d.job = job; redraw(i);
    });
    return;
  }
  discs = j.discs;
  render();
}

const gb = b => (b/1e9).toFixed(1) + " GB";
const eta = s => s == null ? "" : s >= 3600 ? `${Math.floor(s/3600)}h ${pad(Math.floor(s%3600/60))}m left` : `${Math.max(1, Math.round(s/60))} min left`;
const progText = a => a ? `${gb(a.done)} of ${gb(a.total)} · title ${Math.min(a.titles_done, a.titles)} of ${a.titles}` +
  (a.mb_s ? ` · ${a.mb_s} MB/s` : "") + (a.eta_s != null ? ` · ${eta(a.eta_s)}` : "") : "";
const pctOf = d => d.progress ? Math.max(d.progress.pct, d.ripping ? d.pct||0 : 0) : d.pct||0;
const stateText = d => {
  if (!d.loaded) return "Empty";
  if (d.ripping) return d.state === "scanning" ? "Reading the disc…" : `Ripping ${pctOf(d)}%` + (d.progress ? ` · ${progText(d.progress)}` : d.message ? ` · ${d.message}` : "");
  if (d.elsewhere) return d.progress ? `Ripping ${d.progress.pct}% (in another window) · ${progText(d.progress)}` : "Being ripped by another window";
  if (d.state === "done" && d.rip_label === d.label) return "Done · " + (d.message||"");
  if (["check","error","cancelled"].includes(d.state) && d.rip_label === d.label) return (d.state === "cancelled" ? "Cancelled" : "Problem: ") + (d.state === "cancelled" ? "" : d.message||"");
  if (d.state === "in_plex" && d.rip_label === d.label) return d.message;
  if (d.state === "low_space" && d.rip_label === d.label) return d.message;
  if (d.already) return "Ripped · waiting for review (ejects once you file it)";
  return "Waiting to rip";
};

// new rips appear on the Review tab without losing edits on the cards already open
async function addNewDiscs(){
  const j = await api("/api/discs");
  const have = new Set(discs.map(d => d.folder));
  const byFolder = Object.fromEntries(j.discs.map(d => [d.folder, d]));
  discs.forEach((d, i) => {  // a disc being filed automatically: show its progress
    const nd = byFolder[d.folder] || {job: (j.jobs||{})[d.folder] || (d.job ? d.job : {state:"done", current:"Filed"})};
    if (!nd.job || JSON.stringify(nd.job) === JSON.stringify(d.job || null)) return;
    d.job = nd.job; redraw(i);
    if (nd.job.state === "running") poll();

  const fresh = j.discs.filter(d => !have.has(d.folder));
  if (!fresh.length) return;

  $("#sub").textContent = `${discs.filter(d => !(d.job && d.job.state === "done")).length} disc(s) waiting · library: ${LIB}`;
  const list = $("#list");
  if (!list.querySelector(".card")) return render();
  const start = discs.length - fresh.length;  // add the new cards below, leave the open ones alone
  list.insertAdjacentHTML("beforeend", fresh.map((p, k) => card(p, start + k)).join(""));

}

})();

$("#scan").onclick = async () => { $("#scan").disabled = true; const j = await api("/api/scan", {}); $("#scan").disabled = false; await load(false); $("#sub").textContent += ` · ${j.planned} new`; };
load(false).catch(e => $("#list").innerHTML = `<p class="empty err">${esc(e.message)}</p>`);
</script>
</body>
</html>
