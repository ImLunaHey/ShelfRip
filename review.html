<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelfrip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='3' y='4' width='5' height='18' rx='1.5' fill='%23F2B33D'/%3E%3Crect x='10' y='7' width='5' height='15' rx='1.5' fill='%236C9BFF'/%3E%3Crect x='17' y='5' width='5' height='17' rx='1.5' fill='%234CC38A'/%3E%3Crect x='2' y='23' width='24' height='2.5' rx='1' fill='%23C9D1DC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1014; --bar:#12151B; --card:#161A21; --card2:#1E232C; --ink:#ECEFF4; --muted:#9AA3B2; --line:#262C36; --line2:#343B47;
  --accent:#6C9BFF; --accent-ink:#0B1020; --xp:#F2B33D; --xp-ink:#1A1204; --warn-bg:#3A2E12; --warn:#F7C86A;
  --skip:#6b7580; --ok:#4CC38A; --ok-bg:#1D3A2C; --ok-ink:#7EE0AE; --err:#FF8A7A; --chip:#1E232C; --input:#0E1014; --flame:#FF8A4C;
  --head:"Space Grotesk","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F4F5F8; --bar:#FFFFFF; --card:#FFFFFF; --card2:#EEF1F5; --ink:#161A21; --muted:#5A6472; --line:#DDE2E8; --line2:#C9D0D9;
    --accent:#2F64D8; --accent-ink:#FFFFFF; --xp:#9A6400; --xp-ink:#FFFFFF; --warn-bg:#FFF4D6; --warn:#7A5200;
    --skip:#9aa4ae; --ok:#1F8A55; --ok-bg:#E2F5EA; --ok-ink:#17643E; --err:#B42318; --chip:#EEF1F5; --input:#FFFFFF; --flame:#D2551B;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--head);letter-spacing:-.01em}
header{position:sticky;top:0;z-index:5;background:var(--bar);border-bottom:1px solid var(--line);
  padding:10px 24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--head);font-weight:700;font-size:19px;margin-right:6px}
header .sub{color:var(--muted)}
main{max-width:1240px;margin:0 auto;padding:22px 24px 90px}
button{font:inherit;border:1px solid var(--line2);background:var(--card2);color:var(--ink);
  border-radius:10px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.gold{background:var(--xp);color:var(--xp-ink);border-color:var(--xp);font-weight:700}
button.good{background:var(--ok-bg);color:var(--ok-ink);border-color:var(--ok);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid var(--line2);border-radius:8px;padding:5px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:0 0 20px;overflow:hidden}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.hero{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.hero .info{flex:1 1 380px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.title{font-family:var(--head);font-size:24px;font-weight:700;line-height:1.15}
.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);text-decoration:none}
.chip.good{background:var(--ok-bg);color:var(--ok-ink);font-weight:600}
.chip.warnc{background:var(--warn-bg);color:var(--warn);font-weight:600}
.chip.xp{background:transparent;color:var(--xp);font-weight:700;font-family:var(--head);font-size:14px;padding:0}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}
.err{color:var(--err)} .ok{color:var(--ok)}
label.f{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
label.f input{min-width:0}
.libdir{flex:1 1 420px} .libdir input{width:100%}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--card2)}
tr.skip td{color:var(--skip)} tr.skip input,tr.skip select.typ{opacity:.45} tr.skip .nm{text-decoration:line-through}
td.dur{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
td.src{font-size:12px;color:var(--muted);max-width:160px;overflow-wrap:anywhere}
td.name input{width:100%}
.dest{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:3px}
.note{font-size:12px;color:var(--warn)}
.foot{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card2);border-top:1px solid var(--line)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;flex:1 1 200px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.bar.ok>i{background:var(--ok)} .bar.xp>i{background:var(--xp)}
.search{display:none;gap:6px;flex-direction:column;padding:10px;background:var(--card2);border-radius:12px}
.search.open{display:flex}
.result{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.result small{color:var(--muted)}
.result .poster{width:46px;height:68px;border-radius:6px;font-size:8px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
.tablewrap{overflow-x:auto}
nav.tabs{display:none;gap:2px;flex-wrap:wrap} nav.tabs.on{display:flex}
nav.tabs button{border-radius:999px;border-color:transparent;background:transparent;padding:8px 14px;font-weight:500}
nav.tabs button.cur{background:var(--ink);color:var(--bg);font-weight:600}
.count{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--xp);color:var(--xp-ink);font-size:12px;font-weight:700;margin-left:6px}
.count.zero{background:var(--chip);color:var(--muted)}
.seg{display:inline-flex;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 12px;font-weight:600;min-width:58px}
.seg button.on.keep{background:var(--ok);color:#0B1A12} .seg button.on.skip{background:var(--line2);color:var(--ink)}
/* poster */
.poster{flex:none;width:84px;height:124px;border-radius:10px;background:var(--card2) center/cover no-repeat;border:1px solid var(--line2);
  display:flex;align-items:flex-end;padding:7px;font-family:var(--head);font-weight:700;font-size:11px;color:#E8EDF5;overflow:hidden;position:relative}
.poster.big{width:168px;height:248px;border-radius:14px;font-size:16px;padding:12px}
.poster.has span{display:none}
.poster .ring{position:absolute;right:-1px;bottom:-1px}
/* HUD */
.hud{display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.streak.cold{color:var(--muted)}
.lvl{display:flex;align-items:center;gap:10px;min-width:230px;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.lvl .n{width:38px;height:38px;border-radius:10px;background:var(--xp);color:var(--xp-ink);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:16px}
.lvl .t{flex:1;display:grid;gap:4px} .lvl .t div:first-child{display:flex;justify-content:space-between;font-size:12px;gap:10px}
.lvl .t .bar{height:7px;flex:none}
/* home */
.panels{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.goal{display:grid;gap:6px} .goal .row{justify-content:space-between}
.goal.done .bar>i{background:var(--ok)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar h2,.sect h2{margin:0;font-size:20px}
.switch{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;cursor:pointer;font-weight:600}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tog{width:40px;height:24px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.switch .tog::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--bg);transition:left .2s}
.switch input:checked+.tog{background:var(--ok)} .switch input:checked+.tog::after{left:19px}
.switch input:focus-visible+.tog{outline:2px solid var(--accent);outline-offset:2px}
.drives{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:26px}
.drive{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;align-content:start}
.drive.busy{border-color:#3A4A6B} .drive.ready{border-color:var(--xp)} .drive.idle{border-style:dashed}
.drive .top{display:flex;gap:16px;align-items:center}
.drive .dev{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em}
.drive .lab{font-family:var(--head);font-weight:600;font-size:18px;overflow-wrap:anywhere;line-height:1.2}
.drive .st{color:var(--muted);font-size:13px}
.drive .st.live{color:var(--accent);font-weight:600} .drive .st.ready{color:var(--xp);font-weight:600}
.drive .bar{flex:none}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:26px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:14px;align-items:center;cursor:pointer;text-align:left;color:inherit;font:inherit}
.qcard .poster{width:60px;height:88px}
.qcard:hover{border-color:var(--muted)}
details.log summary{cursor:pointer;color:var(--muted);margin-bottom:8px}
pre.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12px;
  max-height:320px;overflow:auto;white-space:pre-wrap;margin:0;color:var(--muted)}
.disk{display:flex;gap:8px;flex-wrap:wrap}
/* shelf */
.shelf{display:flex;align-items:flex-end;gap:4px;padding:0 14px;min-height:188px;overflow-x:auto;border-bottom:10px solid #5A4632;border-radius:0 0 4px 4px}
.spine{flex:none;width:30px;border-radius:4px 4px 2px 2px;display:flex;align-items:center;justify-content:center;padding:8px 0;
  border-top:4px solid rgba(255,255,255,.18);color:#F4F6FA;cursor:default}
.spine span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--head);font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;max-height:100%}
.spine.new{animation:drop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes drop{from{transform:translateY(-60px);opacity:0}to{transform:none;opacity:1}}
.ranks{display:grid;gap:10px}
.rank{display:flex;align-items:center;gap:12px}
.rank .n{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;background:var(--card2);color:var(--muted)}
.rank.got .n{background:var(--warn-bg);color:var(--xp)} .rank.cur .n{background:var(--xp);color:var(--xp-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:5px;justify-items:start}
.badge.locked{opacity:.55} .badge .bar{width:100%;height:5px;flex:none}
/* moments */
.celebrate{background:var(--ok-bg);border:1px solid var(--ok);border-radius:18px;padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:0 0 20px}
.celebrate .big{font-family:var(--head);font-size:24px;font-weight:700}
#toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:20;max-width:360px}
.toast{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.4);
  display:flex;gap:12px;align-items:center;animation:pop .35s ease-out}
.toast b{font-family:var(--head)}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.spine.new,.toast{animation:none}.bar>i{transition:none}}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:14px;max-width:780px}
.set label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.set label.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.set input[type=text],.set input[type=password],.set input[type=number],.set select{width:100%}
.wiz{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:780px;margin-bottom:16px}
.wiz h2{margin:0 0 4px;font-size:22px}
.wiz ol{margin:12px 0;padding-left:22px;display:grid;gap:14px}
.wiz li label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.wiz li input[type=text],.wiz li input[type=password],.wiz li select{width:100%}
.wiz li label.chk{display:flex;gap:8px;align-items:center;margin-top:6px}
.wiz .how{font-size:12px;color:var(--muted)}
.hide{display:none!important}
.aud{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.aud .trk{border:1px solid var(--line2);border-radius:12px;padding:1px 8px;cursor:pointer;background:var(--card);color:var(--muted);font-size:12px}
.aud .trk.com{border-color:var(--accent);color:var(--ink)}
.aud input{font-size:12px;padding:2px 5px;min-width:220px}
tr.splitrow td{background:var(--card2);border-bottom:1px solid var(--line)}
.split{display:grid;gap:6px;padding:4px 0}
.split table td{border-bottom:none;padding:3px 6px}
.split .sl{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted);font-size:12px}
.split .snm{width:100%}
.play{border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center}
@media (max-width:700px){ td.src{display:none} th.src{display:none} .lvl{min-width:0} .lvl .t{display:none} .poster.big{width:110px;height:162px} }
#upd{font-size:13px;font-weight:600}
</style>
</head>
<body>
<header>
  <span class="brand"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="4" width="5" height="18" rx="1.5" fill="#F2B33D"/><rect x="10" y="7" width="5" height="15" rx="1.5" fill="#6C9BFF"/><rect x="17" y="5" width="5" height="17" rx="1.5" fill="#4CC38A"/><rect x="2" y="23" width="24" height="2.5" rx="1" fill="#9AA3B2"/></svg>Shelfrip</span>
  <nav class="tabs" id="tabs" aria-label="Main">
    <button data-tab="drives">Home</button>
    <button data-tab="review">Review<span class="count zero" id="nwait">0</span></button>
    <button data-tab="library">My shelf</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <span class="sub" id="sub"></span>
  <span style="flex:1"></span>
  <button id="scan" class="tab-review">Check for new rips</button>
  <a id="upd" class="hide" target="_blank" rel="noopener"></a>
  <div class="hud hide" id="hud"></div>
  <button id="quit" class="hide">Quit</button>
</header>
<div id="toasts" aria-live="polite"></div>
<main id="drivesTab" class="hide"></main>
<main id="list"><p class="empty">Loading…</p></main>
<main id="libraryTab" class="hide"></main>
<main id="settingsTab" class="hide"></main>

<script>
const CATS = ["Featurettes","Behind the Scenes","Deleted Scenes","Interviews","Scenes","Shorts","Trailers","Other"];
let discs = [], LIB = "", LIB_RIPPED = "", SERVER = "plex", SERVER_NAME = "Plex";
// name parts the same way naming.py does for the chosen media server
const idTag = id => !id ? "" : SERVER === "plex" ? ` {tmdb-${id}}` : SERVER === "jellyfin" ? ` [tmdbid-${id}]` : SERVER === "emby" ? ` [tmdbid=${id}]` : "";
const editionName = (base, ed) => SERVER === "plex" ? `${base} {edition-${ed}}` : `${base} - ${ed}`;
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safe = s => String(s||"").replace(/\s*:\s*/g," - ").replace(/[<>"/\\|?*]/g,"").replace(/\s+/g," ").trim().replace(/[ .]+$/,"");

async function api(path, body){
  const r = await fetch(path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j;
}

// ------------------------------------------------------------------ the game layer: box art, XP, toasts
let PROG = null;
const POSTERS = {};
const hueOf = t => { let h = 0; for (const c of String(t||"")) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const tint = t => `hsl(${hueOf(t)} 32% 28%)`;
// Box art: TMDB's poster (a season's own poster for TV), or the CD's cover from the Cover Art Archive.
function poster(kind, id, season, title, cls = "", mbid = ""){
  const data = kind === "music" ? (mbid ? `data-url="https://coverartarchive.org/release/${esc(mbid)}/front-250"` : "")
    : id ? `data-pk="${esc(kind)}" data-pid="${esc(id)}" data-ps="${esc(season ?? "")}"` : "";
  const k = kind === "music" ? mbid : `${kind}:${id}:${season ?? ""}`, url = SHOWN[k];
  return `<div class="poster ${cls} ${url ? "has" : ""}" ${data} role="img" aria-label="Box art: ${esc(title)}" style="background-color:${tint(title)}${url ? `;background-image:url('${esc(url)}')` : ""}"><span>${esc(title)}</span></div>`;
}
const SHOWN = {};  // box art already loaded: drawn straight away when the page redraws
function hydrate(root){
  (root || document).querySelectorAll(".poster").forEach(async d => {
    if (d.classList.contains("has") && !(d.closest(".hero") && !d.closest(".hero").querySelector(".blurb").textContent)) return;
    let r = {};
    if (d.dataset.url) r = {url: d.dataset.url};
    else if (d.dataset.pid){
      const k = `${d.dataset.pk}:${d.dataset.pid}:${d.dataset.ps}`;
      POSTERS[k] = POSTERS[k] || api(`/api/poster?kind=${d.dataset.pk}&id=${d.dataset.pid}&season=${d.dataset.ps}`).catch(() => ({}));
      r = await POSTERS[k];
    }
    if (r.url){
      const img = new Image();
      img.onload = () => { d.style.backgroundImage = `url("${r.url}")`; d.classList.add("has");
        SHOWN[d.dataset.url ? d.dataset.url.split("/")[4] : `${d.dataset.pk}:${d.dataset.pid}:${d.dataset.ps}`] = r.url; };
      img.src = r.url;
    }
    const blurb = d.closest(".hero") && d.closest(".hero").querySelector(".blurb");
    if (blurb && r.overview && !blurb.textContent) blurb.textContent = r.overview;
  });
}
// XP for filing this disc (the same rules as progress.py)
function xpOf(p){
  const kept = (p.items||[]).filter(it => it.action === "move");
  let xp = 50;
  if (p.kind === "music") return xp + 2 * kept.length;
  for (const it of kept){
    if (it.role === "extra") xp += 5 + (it.name && !/^(Extra \d+ \(|Unused clip)/i.test(it.name) ? 10 : 0);
    else if (["main","edition","episode"].includes(it.role)) xp += 10;
  }
  if (/4k/i.test(p.format || "")) xp += 30;
  return xp;
}
function toast(title, text, color){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3l14 8v18l-14 8-14-8V11z" fill="${color || "var(--xp)"}"/></svg><div><b>${esc(title)}</b><div style="color:var(--muted);font-size:13px">${esc(text)}</div></div>`;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), 7000);
}
const ring = (pct, size, stroke, color, inner) => { const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * Math.min(100, pct) / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>${inner || ""}</svg>`; };

// Fetch progress; when it moved on, say so (level up, new badges).
async function loadProgress(announce){

function confChip(p){
  const w = liveWarnings(p).length;

  return w ? `<span class="chip warnc">${w} thing${w === 1 ? "" : "s"} to check</span>` : `<span class="chip">Check the names</span>`;
}
function epRange(p){
  const e = p.items.filter(it => it.role === "episode" && it.action === "move" && it.season).flatMap(it => it.episodes || [it.episode]).filter(Boolean).sort((a,b) => a-b);
  return e.length ? `Season ${p.season} · episode${e.length > 1 ? `s ${e[0]} to ${e[e.length-1]}` : ` ${e[0]}`}` : p.season ? `Season ${p.season}` : "";

const KIND = {"Featurettes":"Featurette","Behind the Scenes":"Behind the scenes","Deleted Scenes":"Deleted scene","Interviews":"Interview","Scenes":"Scene","Shorts":"Short","Trailers":"Trailer","Other":"Other"};
const SUFFIX = {"Behind the Scenes":"behindthescenes","Deleted Scenes":"deleted","Featurettes":"featurette","Interviews":"interview","Scenes":"scene","Shorts":"short","Trailers":"trailer","Other":"other"};
function destOf(p, it){
  // TV extras can belong to the whole show, a season (default) or one episode (Plex's TV extras guide)
  const cat = it.category || "Other";
  const folder = SERVER === "kodi" ? "Extras" : cat;   // Kodi keeps all extras in one Extras folder
  if (it.role === "extra" && p.kind === "tv" && it.attach === "show") return [LIB, p.library_dir, folder].join("\\") + "\\" + safe(it.name) + ".mkv";
  if (it.role === "extra" && p.kind === "tv" && it.attach === "episode" && SERVER !== "kodi"){
    if (!it.attach_to) return "pick the episode it belongs to";
    const same = p.items.filter(o => o.role === "extra" && o.action === "move" && o.attach === "episode" && o.attach_to === it.attach_to && (o.category || "Other") === cat);
    const k = same.findIndex(o => o === it || o.source === it.source);
    return [LIB, it.dest_dir].join("\\") + "\\" + safe(`${it.attach_to}-${SUFFIX[cat] || "other"}${same.length > 1 ? k + 1 : ""}`) + ".mkv";
  }
  const parts = [LIB, it.dest_dir];
  if (it.role === "extra") parts.push(folder);
  return parts.join("\\") + "\\" + safe(it.name) + ".mkv";
}
function episodeStems(p){  // episodes on this disc, then ones already in the library's season folder
  const out = [];
  for (const it of p.items){
    if (it.role !== "episode" || it.action !== "move") continue;
    if (it.needs_split && it.split) it.split.names.forEach((n, k) => { if (!(it.split.skip||[]).includes(k)) out.push(safe(n)); });
    else out.push(safe(it.name));
  }
  for (const f of p.season_files || []) out.push(f);
  return [...new Set(out)];
}
function attachLine(p, it, j){
  if (p.kind !== "tv" || it.role !== "extra" || it.action === "skip") return "";
  const a = it.attach || "season";
  const eps = episodeStems(p);
  return `<div class="row" style="gap:6px;font-size:12px;margin-top:4px">Belongs to
    <select class="att" data-j="${j}"><option value="season" ${a==="season"?"selected":""}>Season ${esc(p.season)}</option>
      <option value="show" ${a==="show"?"selected":""}>Whole show</option><option value="episode" ${a==="episode"?"selected":""}>An episode…</option></select>
    ${a === "episode" ? `<select class="atte" data-j="${j}" style="max-width:340px"><option value="">pick the episode</option>${eps.map(e =>
      `<option value="${esc(e)}" ${e===it.attach_to?"selected":""}>${esc((e.match(/s\d+e\d+.*$/i)||[e])[0])}</option>`).join("")}</select>
      as <select class="attk" data-j="${j}">${CATS.map(c => `<option value="${c}" ${c===(it.category||"Other")?"selected":""}>${KIND[c]}</option>`).join("")}</select>` : ""}</div>`;

// Keep each item's folder in step with the show/movie folder at the top of the card
function reflow(p){
  for (const it of p.items){
    it.dest_dir = p.kind !== "tv" ? p.library_dir
      : (it.role === "episode" && it.season === 0) ? `${p.library_dir}\\Specials` : `${p.library_dir}\\Season ${p.season}`;
  }
}

// The "Type" menu: what each ripped title is. Extras pick their Plex category here too.
function typeValue(it){
  if (it.role === "extra") return "x:" + (it.category || "Other");
  if (it.role === "episode") return it.season === 0 ? "special" : "episode";
  return it.role;   // main, edition, play_all
}
function typeOptions(p, it){
  const opts = p.kind === "tv"
    ? [["episode","Episode"],["special","Special (Season 0)"]]
    : [["main","Movie"],["edition","Other version"]];
  if (it.role === "play_all") opts.push(["play_all","Play All"]);
  const cur = typeValue(it);
  return opts.map(([v,l]) => `<option value="${v}" ${v===cur?"selected":""}>${l}</option>`).join("")
    + `<optgroup label="Extra">` + CATS.map(c => `<option value="x:${c}" ${("x:"+c)===cur?"selected":""}>${c}</option>`).join("") + `</optgroup>`;
}
const pad = n => String(n).padStart(2,"0");
const mmss = s => { s = +s||0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return h ? `${h}h${pad(m)}m` : `${m}m${pad(x)}s`; };
function epTail(name){ return (String(name||"").split(/ - s\d+e\d+(?:-e\d+)?/i)[1] || "").replace(/^ - /,""); }
// --- videos holding several episodes: where each one starts (mirrors split.py)
const hms = s => { s = Math.max(0, +s||0); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = Math.floor(s%60); return (h ? h + ":" + pad(m) : m) + ":" + pad(x); };
function epRanges(sp, i){
  const ch = sp.chapters, n = ch.length, st = sp.starts;
  const op = sp.copy_opening ? (sp.opening||0) : 0, en = sp.copy_ending ? (sp.ending||0) : 0;
  const t = j => j < n ? ch[j] : sp.total;
  const a = (i === 0 && !op) ? 0 : st[i], b = i + 1 < st.length ? st[i+1] : n - en;
  const r = [];
  if (op && st[i] >= op) r.push([t(0), t(op)]);
  r.push([t(a), t(b)]);

const epLen = (sp, i) => epRanges(sp, i).reduce((s, [a,b]) => s + b - a, 0);

function splitRow(p, it, j){

      `<option value="${k}" ${k===sel?"selected":""}>${k ? `${label} ${k} chapter${k>1?"s":""}` : "none"}</option>`).join("");
  const opLen = sp.opening ? sp.chapters[Math.min(sp.opening, n-1)] - sp.chapters[0] : 0;
  const bad = splitBad(sp);
  const rows = sp.starts.map((st, k) => {

const filesOf = it => it.action !== "move" ? 0 : (it.needs_split && it.split ? it.split.starts.length - (it.split.skip||[]).length : 1);

function setType(p, it, v){
  const prefix = safe(p.title + (p.year ? ` (${p.year})` : ""));
  const tag = idTag(p.tmdb_id);
  const was = it.role;
  it.needs_split = false; delete it.split;
  if (v.startsWith("x:")){
    const keepName = was === "extra" || was === "play_all" ? it.name : "";
    it.role = "extra"; it.category = v.slice(2);
    it.name = keepName || epTail(it.name) || `Extra (${mmss(it.duration_seconds)})`;
    delete it.episode; delete it.episodes;
  } else if (v === "episode" || v === "special"){
    const season = v === "special" ? 0 : p.season;
    const used = p.items.filter(o => o !== it && o.role === "episode" && (o.season||0) === season)
                        .flatMap(o => o.episodes || [o.episode]);
    const n = Math.max(0, ...used) + 1;
    const tail = was === "extra" ? it.name : epTail(it.name);
    Object.assign(it, {role:"episode", season, episode:n, episodes:[n]});
    delete it.category;
    it.name = `${prefix} - s${pad(season)}e${pad(n)}` + (tail ? ` - ${safe(tail)}` : "");
  } else if (v === "main"){
    p.items.forEach(o => { if (o !== it && o.role === "main"){ o.role = "edition"; o.name = editionName(`${prefix}${tag}`, "Alternate"); } });
    it.role = "main"; delete it.category; it.name = `${prefix}${tag}`;
  } else if (v === "edition"){
    it.role = "edition"; delete it.category; it.name = editionName(`${prefix}${tag}`, "Alternate");
  } else {
    it.role = v; delete it.category;

// ------------------------------------------------------------------ music CDs
const fsName = t => String(t||"").replace(/\s*[\/\\]\s*/g, "-").replace(/\s*:\s*/g, " - ").replace(/[<>"|?*\x00-\x1f]/g, "").replace(/\s+/g, " ").replace(/^[ .]+|[ .]+$/g, "").slice(0, 120);

const PH = /extra\(s\) still have placeholder names/;
// an extra tied to one episode is named after that episode, so its own name isn't used
const byEpisode = (p, it) => p.kind === "tv" && it.role === "extra" && it.attach === "episode";
const isPlaceholder = it => it.role === "extra" && it.action === "move" && it.attach !== "episode" && /^Extra \d+ \(/.test(it.name || "");
function phWarning(p){ const n = p.items.filter(isPlaceholder).length; return n ? `${n} extra(s) still have placeholder names.` : ""; }
function liveWarnings(p){
  const ws = (p.warnings||[]).filter(w => !PH.test(w));
  const ph = phWarning(p);
  return ph ? ws.concat([ph]) : ws;
}
function autoLine(p){
  const a = p.auto;
  if (!a || (p.job && p.job.state)) return "";
  if (!a.blocked.length){
    const t = new Date(a.at * 1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
    return `<div class="auto">✓ Everything matched with confidence: files automatically ${a.at * 1000 <= Date.now() ? "in a moment" : "at " + t}. <button class="hold">I'll review it</button></div>`;
  }
  const own = a.blocked.filter(w => !(p.warnings||[]).includes(w));
  return own.length ? `<div class="sub" style="color:var(--muted);font-size:12px">Waiting for your review: ${esc(own.join("; "))}</div>` : "";
}
function musicCard(p, i){
  const job = p.job;
  const keep = p.items.filter(it => it.action === "move").length;
  const pct = job && job.total_bytes ? Math.round(100 * job.done_bytes / job.total_bytes) : 0;
  const showArtist = p.compilation || p.items.some(it => it.artist && it.artist !== p.album_artist);
  const rows = p.items.map((it, j) => `<tr class="${it.action === "skip" ? "skip" : ""}">
      <td><button class="play" data-j="${j}" title="Play" aria-label="Play">▶</button></td>
      <td class="dur">${pad(it.track)}</td><td class="dur">${esc(it.duration)}</td>
      <td><div class="seg" role="group" aria-label="Keep or skip"><button class="actb keep ${it.action==="move"?"on":""}" data-j="${j}" data-v="move" aria-pressed="${it.action==="move"}">Keep</button><button class="actb skip ${it.action==="skip"?"on":""}" data-j="${j}" data-v="skip" aria-pressed="${it.action==="skip"}">Skip</button></div></td>
      <td class="name"><input class="ttl" data-j="${j}" value="${esc(it.title)}">
        <div class="dest">${it.action==="skip" ? "not filed" : esc(trackFile(p, it))}</div></td>
      <td class="name" ${showArtist ? "" : 'style="display:none"'}><input class="art" data-j="${j}" value="${esc(it.artist||"")}" placeholder="${esc(p.album_artist)}"></td></tr>`).join("");
  return `<section class="card" id="c${i}">
    <div class="card-head">
      <div class="row">
        ${poster("music", "", null, p.album, "", p.release)}
        <span class="title">${esc(p.album)}${p.album_artist ? ` · ${esc(p.album_artist)}` : ""}${p.year ? ` (${esc(p.year)})` : ""}</span>
        <span class="chip">Music CD</span><span class="chip">FLAC</span>
        ${p.release ? `<a class="chip" href="https://musicbrainz.org/release/${esc(p.release)}" target="_blank" rel="noopener">MusicBrainz</a>` : `<span class="chip err">not on MusicBrainz</span>`}
        <span class="chip">disc: ${esc(p.disc_label)}</span>
      </div>
      ${autoLine(p)}
      ${(p.notes||[]).map(n => `<div class="sub" style="color:var(--muted);font-size:12px">${esc(n)}</div>`).join("")}
      ${(p.warnings||[]).map(w => `<div class="warn">${esc(w)}</div>`).join("")}
      ${(p.releases||[]).length > 1 ? `<div class="row"><label class="f" style="flex:1">Release${p.release_sure ? "" : ` <span class="err">(not sure which, please check)</span>`}
        <select class="release" style="max-width:100%">${p.releases.map(r => `<option value="${esc(r.id)}" ${r.id===p.release?"selected":""}>${esc(r.label)}</option>`).join("")}</select></label></div>` : ""}
      <div class="row">
        <label class="f">Album artist <input class="aart" value="${esc(p.album_artist)}" ${p.compilation ? "disabled" : ""}></label>
        <label class="f" style="flex:1">Album <input class="alb" value="${esc(p.album)}" style="width:100%"></label>
        <label class="f">Year <input class="yr" value="${esc(p.year)}" style="width:64px"></label>
        <label class="f">Disc <input class="dno" type="number" min="1" value="${+p.disc||1}" style="width:52px"> of <input class="dof" type="number" min="1" value="${+p.discs||1}" style="width:52px"></label>
        <label class="f"><input type="checkbox" class="comp" ${p.compilation ? "checked" : ""}> Various Artists</label>
      </div>
      <div class="sub dest adir" style="font-size:12px">${esc(albumDir(p))}</div>
      ${(p.accuraterip||[]).length ? `<details style="font-size:12px"><summary>AccurateRip</summary>${p.accuraterip.map(esc).join("<br>")}</details>` : ""}
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>#</th><th>Length</th><th></th><th>Title</th><th ${showArtist ? "" : 'style="display:none"'}>Track artist</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="foot">
      <button class="gold file" ${job && job.state==="running" ? "disabled" : ""}>File ${keep} tracks into ${SERVER_NAME}</button>
      <span class="chip xp">+${xpOf(p)} XP</span>
      <button class="save">Save without filing</button>
      <span style="flex:1"></span>
      <button class="discard" title="Delete this rip">Discard rip</button>
      ${job ? `<span class="${job.state==="error"?"err":job.state==="done"?"ok":""}">${esc(job.current)}${job.note?" · "+esc(job.note):""}</span>
               ${job.state==="running" ? `<div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span>` : ""}` : ""}
      <span class="msg"></span>
    </div>
  </section>`;
}
function wireMusic(p, i, msg, rerender){
  const el = $("#c"+i);
  const refreshDest = () => { $(".adir", el).textContent = albumDir(p);
    el.querySelectorAll(".ttl").forEach(n => { const it = p.items[n.dataset.j]; const d = n.parentElement.querySelector(".dest"); if (d && it.action !== "skip") d.textContent = trackFile(p, it); }); };
  el.querySelectorAll(".play").forEach(b => b.onclick = () => api("/api/play", {folder:p.folder, source:p.items[b.dataset.j].source}).catch(e => msg.textContent = e.message));
  el.querySelectorAll(".actb").forEach(b => b.onclick = () => { el.dispatchEvent(new Event("change")); p.items[b.dataset.j].action = b.dataset.v; rerender(); });
  el.querySelectorAll(".ttl").forEach(n => n.oninput = () => { p.items[n.dataset.j].title = n.value; refreshDest(); });
  el.querySelectorAll(".art").forEach(n => n.oninput = () => { p.items[n.dataset.j].artist = n.value; });
  $(".aart", el).oninput = e => { const old = p.album_artist; p.album_artist = e.target.value;
    p.items.forEach(it => { if (!it.artist || it.artist === old) it.artist = p.album_artist; }); refreshDest(); };
  $(".alb", el).oninput = e => { p.album = p.title = e.target.value; refreshDest(); };
  $(".yr", el).oninput = e => { p.year = e.target.value; };
  $(".dno", el).oninput = e => { p.disc = +e.target.value || 1; refreshDest(); };
  $(".dof", el).oninput = e => { p.discs = +e.target.value || 1; refreshDest(); };
  $(".comp", el).onchange = e => { p.compilation = e.target.checked; rerender(); };
  const rel = $(".release", el);
  if (rel) rel.onchange = async () => {
    msg.textContent = "Renaming from that release…";
    try { const r = await api("/api/release", {folder:p.folder, plan:p, release:rel.value}); Object.assign(p, r.plan); rerender(); }
    catch(e){ msg.textContent = e.message; }
  };
  $(".discard", el).onclick = async () => {
    if (!confirm(`Delete the whole rip of ${p.album || p.disc_label} from ${LIB_RIPPED}? Nothing is copied into ${SERVER_NAME}.`)) return;
    const j = await api("/api/discard", {folder:p.folder});
    if (j.error){ msg.textContent = j.error; return; }
    p.job = {state:"done", current:"Discarded", note:"Rip deleted"}; rerender();
  };
  $(".save", el).onclick = async () => { await api("/api/save", {folder:p.folder, plan:p}); msg.textContent = "Saved."; };
  $(".file", el).onclick = async () => {
    const keep = p.items.filter(it => it.action === "move").length;
    if (!confirm(`Copy ${keep} track(s) into ${albumDir(p)}?`)) return;
    const j = await api("/api/file", {folder:p.folder, plan:p});
    if (j.problems){ const m2 = $(".msg", $("#c"+i)) || msg; m2.innerHTML = `<span class="err">${j.problems.map(esc).join("<br>")}</span>`; return; }
    poll();
  };
}

function wire(p, i){
  const el = $("#c"+i), msg = el && $(".msg", el);
  if (el) hydrate(el);
  const nx = el && $("[data-next]", el);
  if (nx) nx.onclick = () => { const next = discs.find(d => !(d.job && d.job.state === "done")); if (next){ const c = $("#c" + discs.indexOf(next)); c && c.scrollIntoView({behavior:"smooth"}); } else showTab("drives"); };
  if (p._justFiled){ p._justFiled = false; loadProgress(true); }
  if (!msg) return; // filed
  const rerender = () => { const cur = $("#c"+i); if (cur){ cur.outerHTML = card(p, i); wire(p, i); } };
  const hold = () => { if (p.auto && !p.hold){ p.hold = true; p.auto.blocked = ["you chose to review it"]; api("/api/hold", {folder:p.folder}).catch(()=>{}); } };
  el.addEventListener("input", hold); el.addEventListener("change", hold);
  const hb = $(".hold", el); if (hb) hb.onclick = () => { hold(); rerender(); };
  if (p.kind === "music") return wireMusic(p, i, msg, rerender);
  el.querySelectorAll(".play").forEach(b => b.onclick = () => api("/api/play", {folder:p.folder, source:p.items[b.dataset.j].source}).catch(e => msg.textContent = e.message));
  el.querySelectorAll(".actb").forEach(b => b.onclick = () => { el.dispatchEvent(new Event("change")); p.items[b.dataset.j].action = b.dataset.v; rerender(); });
  el.querySelectorAll(".typ").forEach(s => s.onchange = () => { setType(p, p.items[s.dataset.j], s.value); rerender(); });
  el.querySelectorAll(".att").forEach(s => s.onchange = () => { const it = p.items[s.dataset.j]; it.attach = s.value; if (s.value !== "episode") delete it.attach_to; rerender(); });
  el.querySelectorAll(".atte").forEach(s => s.onchange = () => { p.items[s.dataset.j].attach_to = s.value; rerender(); });
  el.querySelectorAll(".attk").forEach(s => s.onchange = () => { p.items[s.dataset.j].category = s.value; rerender(); });
  el.querySelectorAll(".nm").forEach(n => n.oninput = () => {
    const it = p.items[n.dataset.j];
    if (it.role === "episode"){ const was = safe(it.name), now = safe(n.value);  // keep its extras attached
      p.items.forEach(o => { if (o.attach === "episode" && o.attach_to === was) o.attach_to = now; }); }
    it.name = n.value;
    const ph = phWarning(p), box = $(".phwarn", el);
    if (box && !ph) box.remove(); else if (box) box.textContent = ph;
    const d = n.parentElement.querySelector(".dest"); if (d && it.action !== "skip") d.textContent = destOf(p, it);
  });
  // Typed a different sNNeNN into a name? Look the episode up on TMDB and use its title.
  const lookupName = async (input, apply) => {
    const m = input.value.match(/ - s(\d+)e(\d+)(?!\d|-e)/i);
    if (!m) return;
    const season = +m[1], ep = +m[2];
    try {
      const r = await api("/api/epnames", {folder:p.folder, plan:{title:p.title, year:p.year, tmdb_id:p.tmdb_id}, season, episodes:[ep]});
      const full = r.names[ep];
      if (full && / - s\d+e\d+ - /i.test(full)) apply(full, season, ep);
      else msg.textContent = `TMDB has no s${pad(season)}e${pad(ep)} for this show.`;
    } catch(e){ msg.textContent = e.message; }
  };
  el.querySelectorAll(".nm").forEach(n => n.onchange = () => {
    const it = p.items[n.dataset.j];
    if (it.role !== "episode" || (it.episodes||[]).length > 1) return;
    lookupName(n, (full, season, ep) => {
      Object.assign(it, {name: full, season, episode: ep, episodes: [ep]}); delete it.library_copy;
      if (it.note && /TMDB|check the episode number/i.test(it.note)) it.note = "";
      reflow(p); rerender();
    });
  });
  el.querySelectorAll(".snm").forEach(n => n.onchange = () => {
    const it = p.items[n.dataset.j], k = +n.dataset.k;
    lookupName(n, (full, season, ep) => {
      it.split.names[k] = full;
      if (it.episodes && season === it.season) it.episodes[k] = ep;
      delete it.library_copy; rerender();
    });
  });
  el.querySelectorAll(".trk").forEach(b => b.onclick = () => {
    const a = p.items[b.dataset.j].audio[+b.dataset.k];
    a.commentary = !a.commentary; a.guessed = false;
    if (a.commentary && !a.name) a.name = "Commentary";
    rerender();
  });
  el.querySelectorAll(".trkname").forEach(n => n.oninput = () => { p.items[n.dataset.j].audio[+n.dataset.k].name = n.value; });
  el.querySelectorAll(".skp").forEach(c => c.onchange = () => {
    const sp = p.items[c.dataset.j].split, k = +c.dataset.k;
    sp.skip = (sp.skip||[]).filter(x => x !== k).concat(c.checked ? [] : [k]).sort((a,b) => a-b); rerender();
  });
  el.querySelectorAll(".sst").forEach(s => s.onchange = () => { p.items[s.dataset.j].split.starts[+s.dataset.k] = +s.value; rerender(); });
  el.querySelectorAll(".snm").forEach(n => n.oninput = () => {
    const it = p.items[n.dataset.j]; it.split.names[+n.dataset.k] = n.value;
    const d = n.parentElement.querySelector(".dest"); if (d && it.action !== "skip") d.textContent = destOf(p, Object.assign({}, it, {name:n.value}));
  });
  el.querySelectorAll(".spo").forEach(s => s.onchange = () => {
    const sp = p.items[s.dataset.j].split, k = +s.value;
    sp.opening = k; sp.copy_opening = k > 0;
    if (k && sp.starts[0] < k) sp.starts[0] = k;   // the first episode's own part starts after the opening
    if (!k && sp.starts[0] > 0 && sp.starts[0] <= 3) sp.starts[0] = 0;
    rerender();
  });
  el.querySelectorAll(".spe").forEach(s => s.onchange = () => {
    const sp = p.items[s.dataset.j].split, k = +s.value; sp.ending = k; sp.copy_ending = k > 0; rerender();
  });
  el.querySelectorAll(".spn").forEach(s => s.onchange = async () => {
    const it = p.items[s.dataset.j];
    try {
      const r = await api("/api/resplit", {folder:p.folder, plan:{title:p.title, year:p.year, tmdb_id:p.tmdb_id}, item:it, count:+s.value});
      if (r.error){ msg.textContent = r.error; return; }
      it.split = r.split; it.split.skip = []; it.episodes = r.episodes; it.episode = r.episodes[0];
      it.name = it.name.replace(/ - s(\d+)e\d+(?:-e\d+)?/i, (m, ss) => ` - s${ss}e${pad(r.episodes[0])}-e${pad(r.episodes[r.episodes.length-1])}`);
      rerender();
    } catch(e){ msg.textContent = e.message; }
  });
  $(".lib", el).onchange = e => { p.library_dir = e.target.value.replace(/[\\]+$/,""); reflow(p); rerender(); };
  const season = $(".season", el);
  if (season) season.onchange = () => { p.season = +season.value; reflow(p); rerender(); };
  const renum = $(".renum", el);
  if (renum) renum.onclick = async () => {
    const eps = p.items.filter(it => it.role === "episode" && it.season !== 0 && it.action === "move");
    if (!eps.length) return;
    let n = +$(".first", el).value || eps[0].episode || 1;
    const all = [];
    for (const it of eps){
      const cnt = (it.episodes||[1]).length;
      it.season = p.season; it.episode = n; it.episodes = Array.from({length:cnt}, (_, k) => n + k);
      all.push(...it.episodes); n += cnt;
    }
    let names = {};
    try { names = (await api("/api/epnames", {folder:p.folder, plan:{title:p.title, year:p.year, tmdb_id:p.tmdb_id}, season:p.season, episodes:all})).names; }
    catch(e){ msg.textContent = "Couldn't get TMDB titles: " + e.message; }
    const prefix = safe(p.title + (p.year ? ` (${p.year})` : ""));
    const nm = e => names[e] || `${prefix} - s${pad(p.season)}e${pad(e)}`;
    for (const it of eps){
      const e = it.episodes;
      it.name = e.length > 1 ? `${prefix} - s${pad(p.season)}e${pad(e[0])}-e${pad(e[e.length-1])}` : nm(e[0]);
      if (it.split) it.split.names = e.map(nm);
      delete it.library_copy;
      if (it.note && /TMDB has no names|continues in TMDB|numbered as/i.test(it.note)) it.note = "";
    }
    reflow(p); rerender();
  };
  const ed = $(".edition", el);
  if (ed) ed.onchange = async () => {
    msg.textContent = "Renaming extras from that release…";
    try {
      const r = await api("/api/edition", {folder:p.folder, plan:p, edition:ed.value});
      if (r.error) throw new Error(r.error);
      Object.assign(p, r.plan); rerender();
    } catch(e){ msg.textContent = e.message; }
  };
  $(".chg", el).onclick = () => $(".search", el).classList.toggle("open");
  $(".sgo", el).onclick = async () => {
    const res = $(".sres", el); res.textContent = "Searching…";
    try {
      const kind = $(".skind", el).value;
      const j = await api(`/api/search?kind=${kind}&q=${encodeURIComponent($(".sq", el).value)}`);
      res.innerHTML = j.results.map(r => `<div class="result"><button data-id="${r.id}">Use</button>
        <b>${esc(r.title)}</b> <small>${esc(r.year)} · tmdb-${r.id}</small> <small>${esc(r.overview)}</small></div>`).join("") || "No results.";
      res.querySelectorAll("button").forEach(b => b.onclick = async () => {
        res.textContent = "Re-naming…";
        const j2 = await api("/api/rematch", {folder:p.folder, kind, tmdb_id:b.dataset.id, season: kind==="tv" ? (p.season||1) : null});
        discs[i] = j2.plan; p = j2.plan; rerender();
      });
    } catch(e){ res.textContent = e.message; }
  };
  $(".discard", el).onclick = async () => {
    if (!confirm(`Delete the whole rip of ${p.disc_label} from ${LIB_RIPPED}? Nothing is copied into ${SERVER_NAME}.`)) return;
    const j = await api("/api/discard", {folder:p.folder});
    if (j.error){ msg.textContent = j.error; return; }
    p.job = {state:"done", current:"Discarded", note:"Rip deleted"}; rerender();
  };
  $(".save", el).onclick = async () => { await api("/api/save", {folder:p.folder, plan:p}); msg.textContent = "Saved."; };
  $(".file", el).onclick = async () => {
    const keep = p.items.reduce((s, it) => s + filesOf(it), 0);
    if (!confirm(`Move ${keep} file(s) into ${LIB}?`)) return;
    const j = await api("/api/file", {folder:p.folder, plan:p});
    if (j.problems){ if (j.plan){ discs[i] = Object.assign(j.plan, {job: p.job}); p = discs[i]; rerender(); }
      const m2 = $(".msg", $("#c"+i)) || msg;
      m2.innerHTML = `<span class="err">${j.problems.map(esc).join("<br>")}</span>`; return; }
    poll();
  };
}

let polling = null;
function poll(){
  clearTimeout(polling);
  polling = setTimeout(async () => { await load(true); if (discs.some(d => d.job && (d.job.state === "running" || (d.job.plex && /starting|scanning/.test(d.job.plex.state))))) poll(); }, 1500);
}

async function load(keepEdits){
  const j = await api("/api/discs");
  LIB = j.library; LIB_RIPPED = j.ripped; SERVER = j.server || "plex"; SERVER_NAME = j.server_name || "Plex";
  $("#sub").textContent = `${j.discs.length} disc${j.discs.length === 1 ? "" : "s"} waiting` + (j.tmdb ? "" : " · no TMDB key"); $("#sub").title = `Library: ${LIB}`;
  if (keepEdits){ // only refresh job status, keep unsaved edits
    // Redraw just the cards whose filing status changed, so typing or a dropdown open on
    // another card isn't interrupted while a disc is filing.
    const byFolder = Object.fromEntries(j.discs.map(d => [d.folder, d]));
    discs.forEach((d, i) => {
      const job = byFolder[d.folder] ? byFolder[d.folder].job : ((j.jobs||{})[d.folder] || {state:"done", current:"Filed"});
      if (JSON.stringify(job || null) === JSON.stringify(d.job || null)) return;
      if (job && job.state === "done" && job.current !== "Discarded" && !(d.job && d.job.state === "done")) d._justFiled = true;
      d.job = job; redraw(i);
    });
    return;
  }
  discs = j.discs;
  render();
}

// ------------------------------------------------------------------ app tabs (app.py)
let APP = false, TAB = "review", lastWaiting = -1;
function showTab(t){
  TAB = t; try { localStorage.setItem("tab", t); } catch(e){}
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("cur", b.dataset.tab === t));
  $("#drivesTab").classList.toggle("hide", t !== "drives");
  $("#list").classList.toggle("hide", t !== "review");
  $("#settingsTab").classList.toggle("hide", t !== "settings");
  $("#libraryTab").classList.toggle("hide", t !== "library");
  if (t === "library"){ renderShelf(); loadReport(false); loadProgress(false).then(() => TAB === "library" && renderShelf()); }
  $("#scan").classList.toggle("hide", t !== "review");
  $("#sub").classList.toggle("hide", t !== "review");
  if (t === "settings") loadSettings();
  if (t === "drives") pollDrives();
}
const gb = b => (b/1e9).toFixed(1) + " GB";
const eta = s => s == null ? "" : s >= 3600 ? `${Math.floor(s/3600)}h ${pad(Math.floor(s%3600/60))}m left` : `${Math.max(1, Math.round(s/60))} min left`;
const progText = a => a ? `${gb(a.done)} of ${gb(a.total)} · title ${Math.min(a.titles_done, a.titles)} of ${a.titles}` +
  (a.mb_s ? ` · ${a.mb_s} MB/s` : "") + (a.eta_s != null ? ` · ${eta(a.eta_s)}` : "") : "";
const pctOf = d => d.progress ? Math.max(d.progress.pct, d.ripping ? d.pct||0 : 0) : d.pct||0;
const stateText = d => {
  if (!d.loaded) return "Empty";
  if (d.ripping) return d.state === "scanning" ? "Reading the disc…" : `Ripping ${pctOf(d)}%` + (d.progress ? ` · ${progText(d.progress)}` : d.message ? ` · ${d.message}` : "");
  if (d.elsewhere) return d.progress ? `Ripping ${d.progress.pct}% (in another window) · ${progText(d.progress)}` : "Being ripped by another window";

async function addNewDiscs(){

    if (!nd.job || JSON.stringify(nd.job) === JSON.stringify(d.job || null)) return;

  if (r.state === "running") reportTimer = setTimeout(() => loadReport(false), 1500);
}
// First run: the few things the app can't work without, one step at a time.
function wizard(j){
  const val = k => (j.settings.find(s => s.key === k) || {}).value;
  const chk = n => (j.setup||[]).find(x => x.name === n) || {};
  const mark = n => chk(n).ok ? `<span class="ok">✓</span>` : `<span class="err">✗</span>`;
  const servers = (j.settings.find(s => s.key === "media_server") || {}).choices || [];
  return `<div class="wiz"><h2>${j.first_run ? "Welcome to Shelfrip" : "Finish setting up"}</h2>
    <div class="how">Rips your DVDs, Blu-rays and 4K discs with MakeMKV, names everything (movies, episodes and extras), lets you check the names, then files it into your media library.</div>
    <ol>
      <li><label><span>Which media server do you use? Files are named the way it expects.</span>
        <select data-w="media_server">${servers.map(c => `<option value="${esc(c.value)}" ${c.value === val("media_server") ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></label></li>
      <li><label><span>${mark("Media library folder")} Your media library folder: the one that holds (or will hold) Movies and TV Shows folders.</span>
        <input type="text" data-w="plex_library_root" value="${esc(val("plex_library_root") || "")}" placeholder="for example D:\\Media or \\\\NAS\\Media"></label>
        <label class="chk"><input type="checkbox" data-w="format_folders" ${val("format_folders") ? "checked" : ""}> Keep each format in its own folder (Movies\\Blu-Ray\\..., Movies\\DVD\\...)</label></li>
      <li><label><span>${mark("Rip folder")} A rip folder with plenty of free space (about 50 GB per Blu-ray, 100 GB per 4K disc). Discs are ripped here, then moved into the library once you've checked the names.</span>
        <input type="text" data-w="output_root" value="${esc(val("output_root") || "")}" placeholder="for example D:\\Ripped"></label></li>
      <li>${mark("MakeMKV")} <b>MakeMKV</b> does the ripping. ${chk("MakeMKV").ok ? `Found: ${esc(chk("MakeMKV").detail)}` :
        `Install it from <a href="${esc(chk("MakeMKV").link)}" target="_blank" rel="noopener">makemkv.com</a> (free while in beta, or buy a key), then come back here.`}</li>
      <li><label><span>${mark("TMDB key")} A free TMDB API key, used to look up movie and episode names.</span>
        <input type="password" data-w="tmdb_api_key" autocomplete="off" placeholder="${chk("TMDB key").ok ? "set: leave empty to keep it" : "paste your API key here"}"></label>
        <div class="how">Sign up at <a href="https://www.themoviedb.org/signup" target="_blank" rel="noopener">themoviedb.org</a>, open
          <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">Settings › API</a>, request a key (choose Personal use),
          and copy the <b>API Key</b> (the short one).</div></li>
      <li><label class="chk"><input type="checkbox" data-w="share_discs" ${val("share_discs") !== false ? "checked" : ""}>
        <span><b>Help build the Shelfrip disc database.</b> When you file a disc, share what each title turned out to be, so the next person
        with the same disc gets it named right straight away. Only the disc's fingerprint, title lengths and sizes, and the names you chose are sent:
        nothing about you or your files. You can turn it off any time in Settings.</span></label></li>
      <li>${mark("MKVToolNix")} <b>MKVToolNix</b> (optional) splits TV discs that hold several episodes in one video. ${chk("MKVToolNix").ok ? "Found." :
        `<a href="${esc(chk("MKVToolNix").link || "https://mkvtoolnix.download/downloads.html")}" target="_blank" rel="noopener">Download it</a> if you rip TV shows.`}</li>
    </ol>
    <div class="row"><button class="primary" id="wizsave">Save and check</button><span id="wizmsg" style="color:var(--muted)"></span>
      ${j.first_run ? `<span style="flex:1"></span><button id="wizall">Show all settings</button>` : ""}</div>
  </div>`;
}
function wireWizard(el){
  const b = $("#wizsave", el);
  if (!b) return;
  if ($("#wizall", el)) $("#wizall", el).onclick = () => { $(".set", el).style.display = ""; $("#wizall", el).remove(); };
  b.onclick = async () => {
    const values = {};
    el.querySelectorAll("[data-w]").forEach(i => {
      if (i.type === "checkbox") values[i.dataset.w] = i.checked;
      else if (i.type === "password") { if (i.value.trim()) values[i.dataset.w] = i.value.trim(); }
      else values[i.dataset.w] = i.value;
    });
    try {
      const r = await api("/api/settings", {values});
      const left = (r.setup||[]).filter(x => !x.ok && x.required);
      if (!left.length) await api("/api/settings", {values:{setup_done:true}});
      await loadSettings();
      $("#wizmsg") && ($("#wizmsg").textContent = left.length ? `Still needed: ${left.map(x => x.name).join(", ")}` : "");
      if (!left.length){ await load(false); showTab("drives"); }
    } catch(e){ $("#wizmsg").textContent = e.message; }
  };
}
async function loadSettings(){
  const el = $("#settingsTab");
  const j = await api("/api/settings");
  const needs = (j.setup||[]).some(x => !x.ok && x.required);
  el.innerHTML = `${j.first_run || needs ? wizard(j) : `<div style="max-width:760px">${setupBox(j.setup||[], "Setup check")}</div>`}<div class="set" ${j.first_run ? 'style="display:none"' : ""}>
    ${j.settings.map(s => s.kind === "bool"
      ? `<label class="chk"><input type="checkbox" data-k="${s.key}" ${s.value ? "checked" : ""}> ${esc(s.label)}</label>`
      : s.kind === "secret"
      ? `<label>${esc(s.label)} <span class="${s.value ? "ok" : "err"}">${s.value ? "✓ set" : "not set"}</span>
           <input type="password" data-k="${s.key}" autocomplete="off" placeholder="${s.value ? "leave empty to keep the current one" : "paste it here"}"></label>`
      : s.kind === "select"
      ? `<label>${esc(s.label)}<select data-k="${s.key}">${(s.choices||[]).map(c => `<option value="${esc(c.value)}" ${c.value === s.value ? "selected" : ""}>${esc(c.label)}</option>`).join("")}</select></label>`
      : `<label>${esc(s.label)}<input type="${s.kind === "number" ? "number" : "text"}" data-k="${s.key}" value="${esc(s.value)}"></label>`).join("")}
    <div class="row"><button class="primary" id="saveset">Save settings</button><span id="setmsg" style="color:var(--muted)"></span></div>
    <div style="color:var(--muted);font-size:12px">Saved in ${esc(j.path)}. Keys are never shown here once saved.</div>
    <div style="color:var(--muted);font-size:12px">Shelfrip ${esc((j.version||{}).current || "")}. This product uses the TMDB API but is not endorsed or certified by
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. Ripping is done by MakeMKV, which you install and license yourself.
      Extras names also come from TheDiscDB${j.settings.some(s => s.key === "use_dvdcompare" && s.value) ? ", DVDCompare" : ""} and TVmaze; music from MusicBrainz and LRCLIB.</div>
  </div>`;
  wireWizard(el);
  $("#saveset", el).onclick = async () => {
    const values = {};
    el.querySelectorAll("[data-k]").forEach(i => {
      if (i.type === "checkbox") values[i.dataset.k] = i.checked;
      else if (i.type === "password") { if (i.value.trim()) values[i.dataset.k] = i.value.trim(); }
      else values[i.dataset.k] = i.value;
    });
    try { await api("/api/settings", {values}); await loadSettings(); $("#setmsg").textContent = "Saved."; await load(false); }
    catch(e){ $("#setmsg").textContent = e.message; }
  };
}
(async () => {
  try { await api("/api/drives"); APP = true; } catch(e){ APP = false; }
  if (!APP) return;
  $("#tabs").classList.add("on"); $("#quit").classList.remove("hide");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
  let t = "drives"; try { t = localStorage.getItem("tab") || "drives"; } catch(e){}
  if (["drives","review","library","settings"].includes(location.hash.slice(1))) t = location.hash.slice(1);  // e.g. the tray's "Review" item
  try { const v = await api("/api/version"); if (v.latest){ const a = $("#upd"); a.href = v.url; a.textContent = `Shelfrip ${v.latest} is out: get it`; a.classList.remove("hide"); } } catch(e){}
  try { const s = await api("/api/settings"); if (s.first_run || (s.setup||[]).some(x => !x.ok && x.required)) t = "settings"; } catch(e){}
  await loadProgress(false);
  showTab(t);
  pollDrives();
  setInterval(() => loadProgress(true), 60000);
  $("#quit").onclick = async () => {
    let j = await api("/api/quit", {});
    if (j.busy){
      if (!confirm(`Still working on: ${j.busy.join(", ")}. Quitting stops it (a rip is cut off). Quit anyway?`)) return;
      j = await api("/api/quit", {force:true});
    }
    document.body.innerHTML = `<p class="empty">Shelfrip has stopped. You can close this window.</p>`;
  };
})();

$("#scan").onclick = async () => { $("#scan").disabled = true; const j = await api("/api/scan", {}); $("#scan").disabled = false; await load(false); $("#sub").textContent += ` · ${j.planned} new`; };
load(false).catch(e => $("#list").innerHTML = `<p class="empty err">${esc(e.message)}</p>`);
</script>
</body>
